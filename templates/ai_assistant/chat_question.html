{# The user's message in the chat, on the right. assistant.js fills [data-question] for new messages. #}
<li class="flex animate-rise-in justify-end">
  <p data-question class="max-w-[85%] whitespace-pre-line break-words rounded-2xl rounded-br-md bg-primary px-4 py-2.5 text-[15px] leading-relaxed text-white sm:max-w-[75%] sm:text-base">{{ question }}</p>
</li>
