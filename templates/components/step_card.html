{# Numbered step for "How it works"; use inside an <ol>. Fades up one after another. Usage: include "components/step_card.html" with number="1" title="..." text="..." #}
<li data-aos="fade-up" data-aos-delay="{{ number }}00" class="border-t-2 border-line pt-6">
  <span class="text-sm font-extrabold tracking-wider text-primary">0{{ number }}</span>
  <h3 class="mt-2 text-xl font-bold tracking-tight">{{ title }}</h3>
  <p class="mt-2 leading-relaxed text-muted">{{ text }}</p>
</li>
