{# Usage: include "components/nav_link.html" with url=... label=... #}
<a href="{{ url }}" {% if request.path == url %}aria-current="page"{% endif %}
   class="flex min-h-[44px] items-center rounded-lg px-3 text-sm font-medium transition
          {% if request.path == url %}bg-slate-100 text-ink{% else %}text-muted hover:bg-slate-100 hover:text-ink{% endif %}">
  {{ label }}
</a>
