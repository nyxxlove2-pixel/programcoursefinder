{# Round avatar with the first letter of a name. Usage: include "components/avatar.html" with name=user.full_name size="h-10 w-10" #}
<span class="grid {{ size|default:'h-9 w-9' }} shrink-0 place-items-center rounded-full bg-gradient-to-br from-primary to-primary-dark text-sm font-bold text-white ring-2 ring-white" aria-hidden="true">{{ name|first|upper }}</span>
