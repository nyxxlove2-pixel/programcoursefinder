{# Status pill for anything with a pending/approved/other status. Usage: include "components/status_badge.html" with item=organization #}
<span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-bold ring-1 ring-inset
             {% if item.status == 'approved' %}bg-green-50 text-green-700 ring-green-200
             {% elif item.status == 'pending' %}bg-lavender text-primary ring-primary/20
             {% else %}bg-orange-50 text-accent ring-orange-200{% endif %}">
  <span class="h-1.5 w-1.5 rounded-full bg-current" aria-hidden="true"></span>
  {{ item.get_status_display }}
</span>
